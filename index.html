<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>World Clock</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10131a;color:#eef1f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px 20px;background:radial-gradient(ellipse at 12% 0%,#25344d 0,transparent 38%),radial-gradient(ellipse at 90% 30%,#2b2443 0,transparent 32%),#10131a}
    .page{width:min(100%,1080px);margin:auto}.eyebrow{color:#9ce0bf;font-size:.78rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}h1{margin:12px 0 8px;font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.055em}.intro{max-width:620px;margin:0;color:#b6bfd0;line-height:1.65}
    .toolbar{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:18px;margin:30px 0 20px}form{display:flex;flex:1 1 420px;gap:10px}.select-wrap{flex:1}label{display:block;margin-bottom:7px;color:#b6bfd0;font-size:.82rem}
    select,button{min-height:46px;border:1px solid #3a4559;border-radius:10px;font:inherit}select{width:100%;padding:0 12px;background:#171c27;color:#eef1f8}button{padding:0 16px;background:#9ce0bf;color:#101a17;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.06)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #8b9cff;outline-offset:3px}
    .format-toggle{display:flex;align-items:center;gap:9px;min-height:46px;color:#cbd3e1;font-size:.9rem;white-space:nowrap}.format-toggle input{width:18px;height:18px;accent-color:#9ce0bf}.clock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
    .clock-card{min-height:185px;padding:22px;overflow:hidden;border:1px solid #30394c;border-radius:16px;background:linear-gradient(145deg,#1b2230,#151a24);box-shadow:0 16px 38px #0002}.clock-card.local{border-color:#466958;background:linear-gradient(145deg,#1c2a2a,#171c27)}.card-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.city{margin:0;font-size:1.05rem;font-weight:750}.zone{margin:5px 0 0;color:#9ba8bc;font-size:.82rem;overflow-wrap:anywhere}.badge{padding:5px 8px;border-radius:999px;background:#243b33;color:#9ce0bf;font-size:.7rem;font-weight:750;white-space:nowrap}.remove{width:30px;min-height:30px;padding:0;border-color:transparent;background:transparent;color:#aab4c5;font-size:1.2rem;line-height:1}.remove:hover{background:#30394c;color:white}.time{margin:22px 0 2px;font-size:clamp(2.25rem,7vw,3.2rem);font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1}.date{margin:10px 0 0;color:#b6bfd0;font-size:.9rem}footer{margin-top:24px;color:#8290a5;font-size:.82rem}
    @media(max-width:520px){body{padding:32px 16px}form{flex-basis:100%}form button{padding-inline:12px}.toolbar{align-items:start}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">A little time, everywhere</div>
      <h1>World Clock</h1>
      <p class="intro">See the current time around the world. Times update automatically and adjust for each location’s daylight saving rules.</p>
    </header>
    <section class="toolbar" aria-label="Clock settings">
      <form id="add-zone-form">
        <div class="select-wrap">
          <label for="zone-select">Add a time zone</label>
          <select id="zone-select">
            <option value="America/Los_Angeles">Los Angeles · Pacific</option><option value="America/Chicago">Chicago · Central</option><option value="America/New_York">New York · Eastern</option><option value="America/Sao_Paulo">São Paulo</option><option value="Europe/London">London</option><option value="Europe/Paris">Paris</option><option value="Europe/Istanbul">Istanbul</option><option value="Africa/Cairo">Cairo</option><option value="Asia/Dubai">Dubai</option><option value="Asia/Kolkata">Mumbai · India</option><option value="Asia/Singapore">Singapore</option><option value="Asia/Tokyo">Tokyo</option><option value="Australia/Sydney">Sydney</option><option value="Pacific/Auckland">Auckland</option><option value="UTC">UTC</option>
          </select>
        </div>
        <button type="submit">Add clock</button>
      </form>
      <label class="format-toggle" for="hour-format"><input id="hour-format" type="checkbox"> Use 24-hour time</label>
    </section>
    <section id="clock-grid" class="clock-grid" aria-label="Current times by location" aria-live="polite"></section>
    <footer>Times use your device’s clock and the browser’s time-zone database.</footer>
  </main>
  <script>
    const grid=document.querySelector("#clock-grid");
    const form=document.querySelector("#add-zone-form");
    const select=document.querySelector("#zone-select");
    const hourFormat=document.querySelector("#hour-format");
    const localZone=Intl.DateTimeFormat().resolvedOptions().timeZone||"Local time";
    const timeZones=[{zone:localZone,city:"Your local time",local:true},{zone:"America/Los_Angeles",city:"Los Angeles"},{zone:"Europe/London",city:"London"},{zone:"Asia/Tokyo",city:"Tokyo"},{zone:"Australia/Sydney",city:"Sydney"}];

    function zoneLabel(zone,date){return new Intl.DateTimeFormat(undefined,{timeZone:zone,timeZoneName:"short"}).formatToParts(date).find(part=>part.type==="timeZoneName")?.value||zone}
    function renderClocks(){
      const now=new Date();grid.replaceChildren();
      for(const item of timeZones){
        const card=document.createElement("article");card.className=`clock-card${item.local?" local":""}`;
        const top=document.createElement("div");top.className="card-top";
        const group=document.createElement("div");const city=document.createElement("h2");city.className="city";city.textContent=item.city;
        const zone=document.createElement("p");zone.className="zone";zone.textContent=item.zone;group.append(city,zone);top.append(group);
        if(item.local){const badge=document.createElement("span");badge.className="badge";badge.textContent="LOCAL";top.append(badge)}else{
          const remove=document.createElement("button");remove.type="button";remove.className="remove";remove.setAttribute("aria-label",`Remove ${item.city} clock`);remove.title=`Remove ${item.city}`;remove.textContent="×";remove.addEventListener("click",()=>{const i=timeZones.indexOf(item);if(i>0)timeZones.splice(i,1);renderClocks()});top.append(remove)
        }
        const time=document.createElement("p");time.className="time";time.textContent=new Intl.DateTimeFormat(undefined,{timeZone:item.zone,hour:"numeric",minute:"2-digit",second:"2-digit",hour12:!hourFormat.checked}).format(now);
        const date=document.createElement("p");date.className="date";date.textContent=`${new Intl.DateTimeFormat(undefined,{timeZone:item.zone,weekday:"long",month:"long",day:"numeric",year:"numeric"}).format(now)} · ${zoneLabel(item.zone,now)}`;
        card.append(top,time,date);grid.append(card)
      }
    }
    form.addEventListener("submit",event=>{
      event.preventDefault();const zone=select.value;
      if(timeZones.some(item=>item.zone===zone)){const card=[...grid.children].find(el=>el.querySelector(".zone")?.textContent===zone);card?.scrollIntoView({behavior:"smooth",block:"center"});return}
      const city=select.selectedOptions[0].textContent.split(" · ")[0];
      try{new Intl.DateTimeFormat(undefined,{timeZone:zone})}catch{return}
      timeZones.push({zone,city});renderClocks()
    });
    hourFormat.addEventListener("change",renderClocks);renderClocks();setInterval(renderClocks,1000);
  </script>
</body>
</html>
